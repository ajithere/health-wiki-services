# biomarkers.yaml
# Controls which parameters the synthesizer tracks and how it
# normalises raw lab report text to canonical biomarker filenames.
#
# To add a new biomarker: add an entry under `track` and list
# any name variants you expect to see in reports under `aliases`.
#
# Canonical name = the wiki filename without .md
# e.g. ldl-cholesterol → wiki/biomarkers/ldl-cholesterol.md

track:

  # ── Lipid panel ─────────────────────────────────────────────
  - ldl-cholesterol
  - hdl-cholesterol
  - total-cholesterol
  - triglycerides
  - vldl
  - non-hdl-cholesterol

  # ── Metabolic ────────────────────────────────────────────────
  - hba1c
  - fasting-glucose
  - post-prandial-glucose
  - insulin
  - homa-ir

  # ── Thyroid ──────────────────────────────────────────────────
  - tsh
  - t3-total
  - t4-total
  - t3-free
  - t4-free

  # ── Liver ────────────────────────────────────────────────────
  - alt
  - ast
  - alkaline-phosphatase
  - ggt
  - bilirubin-total
  - bilirubin-direct
  - total-protein
  - albumin

  # ── Kidney ───────────────────────────────────────────────────
  - creatinine
  - urea
  - uric-acid
  - egfr
  - bun

  # ── Blood count ──────────────────────────────────────────────
  - hemoglobin
  - hematocrit
  - rbc
  - wbc
  - neutrophils
  - lymphocytes
  - platelets
  - mcv
  - mch

  # ── Cardiac ──────────────────────────────────────────────────
  - hs-crp
  - crp
  - homocysteine
  - lp-a
  - bnp
  - nt-pro-bnp
  - troponin

  # ── Imaging derived ──────────────────────────────────────────
  - cac-score
  - ef-percentage
  - lv-diastolic-dimension
  - lv-systolic-dimension
  - ivs-thickness
  - pw-thickness

  # ── Vitamins and minerals ────────────────────────────────────
  - vitamin-d
  - vitamin-b12
  - folate
  - ferritin
  - serum-iron
  - tibc
  - calcium
  - phosphorus
  - magnesium
  - sodium
  - potassium
  - chloride

  # ── Pancreatic ───────────────────────────────────────────────
  - amylase
  - lipase

  # ── Inflammatory / immune ────────────────────────────────────
  - esr
  - ana
  - rheumatoid-factor

  # ── Hormones ─────────────────────────────────────────────────
  - cortisol
  - dhea-s
  - testosterone
  - estradiol
  - progesterone
  - lh
  - fsh


